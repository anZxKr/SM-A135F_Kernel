name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORM_VERSION: 13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      PYTHONWARNINGS: ignore

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential flex bison bc libssl-dev libncurses-dev libelf-dev cpio rsync unzip kmod ccache binutils-aarch64-linux-gnu

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Cache clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r383902

      - name: Setup Toolchain
        run: |
          if [ "${{ steps.clang-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p $HOME/clang
            wget -qO- https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/fcce3268397ce68ee36f9c52f3a55630897328b3/clang-r383902.tar.gz | tar -xz -C $HOME/clang
          fi
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          $HOME/clang/bin/clang --version | head -1
          for t in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            test -x $HOME/clang/bin/$t || { echo "missing $t"; exit 1; }
          done
          for t in aarch64-linux-gnu-as aarch64-linux-gnu-elfedit; do
            command -v $t || { echo "missing $t"; exit 1; }
          done

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache -z

      - name: Generate .config
        run: |
          make ARCH=arm64 CC="ccache clang" cc-name=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-Wno-deprecated-declarations \
            exynos850-a13ks_defconfig droidspaces.config

      - name: Build Kernel
        run: |
          make ARCH=arm64 CC="ccache clang" cc-name=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            HOSTCFLAGS=-Wno-deprecated-declarations \
            -j$(nproc)

      - name: ccache stats
        run: ccache -s

      - uses: actions/upload-artifact@v4
        with:
          name: Kernel Image
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
