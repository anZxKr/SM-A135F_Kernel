name: Kernel Build

on:
  workflow_dispatch :

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORM_VERSION: 13

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: sudo apt-get update &&  sudo apt-get install -y build-essential flex bison bc libssl-dev libncurses-dev libelf-dev cpio rsync unzip kmod
        
      - name: Setup Toolchains
        run: |
          URL=https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains
          GCC=arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu
          mkdir -p $HOME/clang
          wget -qO- $URL/clang-r353983c.tar.gz | tar -xz -C $HOME/clang
          wget -qO- $URL/$GCC.tar.xz | tar -xJ -C $HOME
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          echo "$HOME/$GCC/bin" >> $GITHUB_PATH
          
      - name: Generate .config
        run: |
          make ARCH=arm64  CC=clang CROSS_COMPILE=aarch64-none-linux-gnu- CLANG_TRIPLE=aarch64-none-linux-gnu- exynos850-a13ks_defconfig droidspaces.config
      
      - name: Build Kernel
        run: |
          make ARCH=arm64  CC=clang CROSS_COMPILE=aarch64-none-linux-gnu- CLANG_TRIPLE=aarch64-none-linux-gnu- -j$(nproc)
      
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel Image
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
